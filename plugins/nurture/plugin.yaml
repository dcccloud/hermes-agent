name: nurture
version: 0.2.0
description: "Avatar-Hermes device automation plugin. Manages a Python device service (FastAPI + uiautomator2) for Android automation and connects to a community knowledge engine to share recipes and operation graphs."
author: NousResearch
kind: standalone
platforms:
  - linux
  - macos
provides_tools:
  - nurture_execute
  - nurture_task_report
hooks:
  - pre_llm_call
  - on_session_start
  - on_session_end
# Hermes plugin loader resolves these via pip into the active venv.
# The hermes plugin itself only needs httpx + PyJWT — the heavy device
# automation stack (uiautomator2, fastapi, ...) is installed for the
# Python device service from python/requirements.txt and runs in its own
# subprocess, so we don't bloat the main hermes import path.
pip_dependencies:
  - httpx>=0.27
  - PyJWT>=2.8
